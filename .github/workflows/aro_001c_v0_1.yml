name: ARO-001c v0.1 frozen execution

on:
  pull_request:
    branches: [main]
    paths:
      - 'crank/ARO_001C_PROBE_VALUE_CALIBRATION_FREEZE_V0_1.md'
      - 'crank/aro_001/run_001c_v0_1.py'
      - '.github/workflows/aro_001c_v0_1.yml'

jobs:
  run-frozen-assay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install frozen runtime dependency
        run: python -m pip install 'numpy>=1.26,<3'

      - name: Execute frozen ARO-001c assay
        run: python crank/aro_001/run_001c_v0_1.py | tee aro_001c_v0_1_result.json

      - name: Validate JSON output
        run: python -m json.tool aro_001c_v0_1_result.json > /dev/null

      - name: Upload frozen result artifact
        uses: actions/upload-artifact@v4
        with:
          name: aro-001c-v0-1-result
          path: aro_001c_v0_1_result.json
          if-no-files-found: error
