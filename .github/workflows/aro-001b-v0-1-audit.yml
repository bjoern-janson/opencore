name: ARO-001b v0.1 execution audit

on:
  pull_request:
    paths:
      - 'crank/ARO_001B_EXPOSURE_CONTROLLED_FREEZE_V0_1.md'
      - 'crank/aro_001/run_001b_v0_1.py'
      - 'crank/results/ARO_001B_V0_1_RESULT.json'
      - '.github/workflows/aro-001b-v0-1-audit.yml'

jobs:
  audit-frozen-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen runtime dependency
        run: python -m pip install 'numpy>=2.0,<3.0'
      - name: Preserve committed expected result
        run: cp crank/results/ARO_001B_V0_1_RESULT.json /tmp/expected.json
      - name: Execute frozen assay
        run: python crank/aro_001/run_001b_v0_1.py > /tmp/aro001b.stdout.json
      - name: Verify generated result equals committed result semantically
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('/tmp/expected.json').read_text())
          generated = json.loads(Path('crank/results/ARO_001B_V0_1_RESULT.json').read_text())
          if expected != generated:
              raise SystemExit('ARO-001b audit mismatch: committed result != frozen executable output')
          print('ARO-001b audit match: committed result == frozen executable output')
          PY
